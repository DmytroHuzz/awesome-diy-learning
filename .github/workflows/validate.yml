name: Validate catalogue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate schema and editorial evidence
        run: python scripts/validate.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check generated Markdown is current
        run: python scripts/generate.py --check
      - name: Check local Markdown links and anchors
        run: python scripts/check_markdown.py
