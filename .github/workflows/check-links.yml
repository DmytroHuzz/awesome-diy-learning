name: Advisory external link check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-link-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check links conservatively (advisory)
        run: python scripts/check_links.py --timeout 10 --delay 1 --output reports/link-check.latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-link-report
          path: reports/link-check.latest.json
          if-no-files-found: warn
          retention-days: 14
