name: Report a broken or restricted link
description: Report errors, redirects, bot blocks or unexpected payment barriers.
title: 'Link: '
body:
  - type: input
    id: resource
    attributes:
      label: Resource ID or title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What happened, and when?
      description: Include date, error or redirect and region if relevant. Do not post login details or personal data.
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Official replacement URL, if known
